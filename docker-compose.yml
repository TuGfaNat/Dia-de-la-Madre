services:
  db:
    image: postgres:16-alpine
    container_name: diadelamadre-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_pass_mama2026}
      POSTGRES_DB: ${DB_NAME:-diadelamadre}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-diadelamadre}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diadelamadre-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Mama2026}
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres_pass_mama2026}@db:5432/${DB_NAME:-diadelamadre}
      DATABASE_SSL: "false"
      FRONTEND_URL: ${FRONTEND_URL:-*}
    volumes:
      - backend_uploads:/app/uploads
      - backend_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: diadelamadre-frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:5000
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER:-59175767332}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  backend_uploads:
    driver: local
  backend_data:
    driver: local
