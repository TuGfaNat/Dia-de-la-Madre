<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pawBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF1F2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#4C0519" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle suave de fondo -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#pawBg)" />

  <!-- Patita de Shiro Neko (almohadilla principal + 4 deditos) -->
  <g fill="url(#padGrad)" filter="url(#shadow)">
    <!-- Almohadilla principal redondeada -->
    <path d="M 32 32 C 23.5 32 19 38.5 20 46 C 20.8 51.5 26.5 54 32 54 C 37.5 54 43.2 51.5 44 46 C 45 38.5 40.5 32 32 32 Z" />
    <!-- 4 deditos/almohadillas superiores -->
    <ellipse cx="17.5" cy="27" rx="4.5" ry="6" transform="rotate(-30 17.5 27)" />
    <ellipse cx="27" cy="20.5" rx="4.6" ry="6.2" transform="rotate(-10 27 20.5)" />
    <ellipse cx="37" cy="20.5" rx="4.6" ry="6.2" transform="rotate(10 37 20.5)" />
    <ellipse cx="46.5" cy="27" rx="4.5" ry="6" transform="rotate(30 46.5 27)" />
  </g>
</svg>
